name: Build Windows packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal
      - name: Package and verify installer
        shell: pwsh
        run: |
          $compiler = ./scripts/get-nsis.ps1 -Directory $env:RUNNER_TEMP
          ./tests/installer.ps1 -NsisCompiler $compiler
          ./scripts/package.ps1 -NsisCompiler $compiler
      - name: Upload download packages
        uses: actions/upload-artifact@v4
        with:
          name: Alpha-windows-x64
          path: |
            dist/Alpha-Setup-*-x64.exe
            dist/Alpha-*-windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
